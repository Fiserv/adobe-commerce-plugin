# Default SCM CI Template for All commerceHub Applications
include:
  - project: 'na/gbs/carat-digital-ecommerce/commercehub/SRE/gitlab-ci'
    ref: COM-18980-v2
    file: '/template-php.yml'
variables:
  ARTIFACT_TYPE: "React"
  APM_ID: "0011801"

# PHP CodeSniffer job - runs only the two requested commands
phpcs:
  stage: test
  image: php:8.1-cli
  before_script:
    - apt-get update && apt-get install -y git zip unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - composer global require magento/magento-coding-standard
    - ~/.composer/vendor/bin/phpcs -d memory_limit=-1 --standard=Magento2 --extensions=php --error-severity=10 --ignore-annotations --report=json --report-file=report.json .
  artifacts:
    when: always
    paths:
      - report.json
    expire_in: 1 week
  allow_failure: false
  only:
    - merge_requests
    - main
    - develop
