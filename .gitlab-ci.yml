# Default SCM CI Template for All commerceHub Applications
include:
  - project: 'na/gbs/carat-digital-ecommerce/commercehub/SRE/gitlab-ci'
    ref: COM-18980-v2
    file: '/template-php.yml'
variables:
  ARTIFACT_TYPE : "React"
  APM_ID: "0011801"

# PHP CodeSniffer job - Aligned with Adobe EQP requirements
phpcs:
  stage: test
  image: php:8.1-cli
  before_script:
    - apt-get update && apt-get install -y git zip unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --prefer-dist --no-progress --no-interaction
  script:
    # Display PHPCS and Magento Coding Standard versions
    - echo "PHP_CodeSniffer version:"
    - vendor/bin/phpcs --version
    - echo "Magento Coding Standard version:"
    - composer show magento/magento-coding-standard | grep versions
    # Run PHPCS with EQP-aligned configuration
    - vendor/bin/phpcs --standard=Magento2 --extensions=php,phtml --error-severity=10 --ignore-annotations --report=json --report-file=phpcs-report.json .
    # Also generate human-readable report
    - vendor/bin/phpcs --standard=Magento2 --extensions=php,phtml --error-severity=10 --ignore-annotations --report=summary .
  artifacts:
    when: always
    paths:
      - phpcs-report.json
    reports:
      codequality: phpcs-report.json
    expire_in: 1 week
  allow_failure: false
  only:
    - merge_requests
    - main
    - develop
