# Default SCM CI Template for All commerceHub Applications
include:
  - project: 'na/gbs/carat-digital-ecommerce/commercehub/SRE/gitlab-ci'
    ref: COM-18980-v2
    file: '/template-php.yml'
variables:
  ARTIFACT_TYPE: "React"
  APM_ID: "0011801"

# PHP CodeSniffer job - Aligned with Adobe EQP requirements
phpcs:
  stage: test
  image: php:8.1-cli
  before_script:
    - apt-get update && apt-get install -y git zip unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --prefer-dist --no-progress --no-interaction
  script:
    - echo "PHP_CodeSniffer version:"
    - vendor/bin/phpcs --version
    - echo "Magento Coding Standard version:"
    - composer show magento/magento-coding-standard | grep versions
    - composer show magento/magento-coding-standard | grep versions || true
    - mv phpcs.xml.dist phpcs.xml.dist.ci.bak || true
    - |
      if vendor/bin/phpcs --standard=vendor/magento/magento-coding-standard/Magento2/ruleset.xml --extensions=php,phtml --error-severity=10 --ignore-annotations --report=json --report-file=phpcs-report.json .; then
        vendor/bin/phpcs --standard=vendor/magento/magento-coding-standard/Magento2/ruleset.xml --extensions=php,phtml --error-severity=10 --ignore-annotations --report=summary .
      else
        vendor/bin/phpcs --standard=vendor/magento-ecg/coding-standard/EcgM2/ruleset.xml --extensions=php,phtml --error-severity=10 --ignore-annotations --report=json --report-file=phpcs-report.json .
        vendor/bin/phpcs --standard=vendor/magento-ecg/coding-standard/EcgM2/ruleset.xml --extensions=php,phtml --error-severity=10 --ignore-annotations --report=summary .
      fi
    - mv phpcs.xml.dist.ci.bak phpcs.xml.dist || true
  artifacts:
    when: always
    paths:
      - phpcs-report.json
    expire_in: 1 week
  allow_failure: false
  only:
    - merge_requests
    - main
    - develop
