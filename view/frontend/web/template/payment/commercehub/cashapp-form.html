<div class="payment-method" data-bind="css: {'_active': (getCode() === isChecked())}">
	<div class="payment-method-title field choice">
		<input type="radio"
			name="payment[method]"
			class="radio"
			data-bind="attr: {id: getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible(), afterRender: afterRender"/>
		<label class="label" data-bind="attr: {for: getCode()}">
			<img data-bind="attr: {src: require.toUrl('Fiserv_Payments/images/Cash-App-image.svg')}" alt="Cash App Pay" style="height: 24px; display: inline-block; vertical-align: middle;"/>
		</label>
	</div>

	<div class="payment-method-content">
		<!-- ko foreach: getRegion('messages') -->
		<!-- ko template: getTemplate() --><!-- /ko -->
		<!--/ko-->

		<div class="payment-method-billing-address">
			<!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
			<!-- ko template: getTemplate() --><!-- /ko -->
			<!--/ko-->
		</div>

		<div data-bind="visible: isPlaceOrderActionAllowed" id="cashapp-button-container"></div>

		<div class="privacyPolicy">
			<span data-bind="i18n: 'Payments Powered by Fiserv.'"></span>
			<a target="_blank" href="https://www.fiserv.com/privacy" data-bind="i18n: 'Privacy Notice'"></a>.
		</div>
	</div>
</div>
