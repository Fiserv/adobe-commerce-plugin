<div class="payment-method" data-bind="css: {'_active': (getCode() === isChecked())}">
	<div class="payment-method-title field choice">
		<input type="radio"
			name="payment[method]"
			class="radio"
			data-bind="attr: {id: getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible(), afterRender: afterRender"/>
		<label class="label" data-bind="attr: {for: getCode()}">
			<img data-bind="attr: {src: require.toUrl('Fiserv_Payments/images/Cash-App-image.svg')}" alt="Cash App Pay" style="height: 24px; display: inline-block; vertical-align: middle;"/>
		</label>
	</div>

	<div class="payment-method-content">
		<!-- ko foreach: getRegion('messages') -->
		<!-- ko template: getTemplate() --><!-- /ko -->
		<!--/ko-->

		<div class="payment-method-billing-address">
			<!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
			<!-- ko template: getTemplate() --><!-- /ko -->
			<!--/ko-->
		</div>

		<!-- ko if: canUseSavedCashApp() -->
			<div class="field choice">
				<input type="radio" name="cashapp_payment_choice" class="radio"
					data-bind="attr: {id: getCode() + '_saved'}, checked: useSavedCashApp, checkedValue: true"/>
				<label class="label" data-bind="attr: {for: getCode() + '_saved'}">
					<span data-bind="i18n: 'Use saved Cash App Pay'"></span>
				</label>
			</div>
			<div class="field choice">
				<input type="radio" name="cashapp_payment_choice" class="radio"
					data-bind="attr: {id: getCode() + '_new'}, checked: useSavedCashApp, checkedValue: false"/>
				<label class="label" data-bind="attr: {for: getCode() + '_new'}">
					<span data-bind="i18n: 'Use Cash App Pay again'"></span>
				</label>
			</div>
		<!-- /ko -->

		<!-- ko if: canSaveCashApp() -->
			<div class="field choice">
				<input type="checkbox"
					name="vault[is_enabled]"
					class="checkbox"
					data-bind="attr: {'id': getCode() + '_enable_vault'}, checked: saveCashApp"/>
				<label class="label" data-bind="attr: {'for': getCode() + '_enable_vault'}">
					<span><!-- ko i18n: 'Save for later use.'--><!-- /ko --></span>
				</label>
			</div>
		<!-- /ko -->

		<div class="checkout-agreements-block">
			<!-- ko foreach: $parent.getRegion('before-place-order') -->
			<!-- ko template: getTemplate() --><!-- /ko -->
			<!-- /ko -->
		</div>

		<div data-bind="visible: isPlaceOrderActionAllowed() && !isUsingSavedCashApp()" id="cashapp-button-container"></div>

		<!-- ko if: isUsingSavedCashApp() -->
			<div class="actions-toolbar">
				<div class="primary">
					<button class="action primary checkout" type="submit"
						data-bind="click: placeOrder, enable: isPlaceOrderActionAllowed, attr: {title: $t('Place Order')}">
						<span data-bind="i18n: 'Place Order'"></span>
					</button>
				</div>
			</div>
		<!-- /ko -->

		<div class="privacyPolicy">
			<span data-bind="i18n: 'Payments Powered by Fiserv.'"></span>
			<a target="_blank" href="https://www.fiserv.com/privacy" data-bind="i18n: 'Privacy Notice'"></a>.
		</div>
	</div>
</div>
