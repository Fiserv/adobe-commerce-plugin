<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio" name="payment[method]" class="radio" data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible(), afterRender: setupPaymentMethod" />
        <label data-bind="attr: {'for': getCode()}" class="label">
            <img data-bind="attr: {src: require.toUrl('Fiserv_Payments/images/ebt-online.png')}" alt="EBT Online" class="fiserv-ebt-online-logo" />
        </label>
    </div>
    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() -->
        <!-- /ko -->
        <!--/ko-->
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() -->
            <!-- /ko -->
            <!--/ko-->
        </div>
        <!-- EBT Card Number -->
        <div class="sdc-row">
            <div class="sdc-field-frame sdc-text">
                <div id="fiserv_ebt_online-card-number" class="sdc-field"></div>
            </div>
        </div>
        <!-- EBT Account Type (SNAP / CASH) — afterRender triggers iframe load -->
        <div class="sdc-row">
            <div class="sdc-field-frame sdc-text">
                <div id="fiserv_ebt_online-ebt-sub-category" class="sdc-field" data-bind="afterRender: loadSdcForm"></div>
            </div>
        </div>
        <!-- EBT PIN — opens the SDK PIN pad modal -->
        <div class="sdc-row">
            <button type="button" class="action fiserv-ebt-pin-button" data-bind="click: openEbtPinPad">
                <span data-bind="i18n: 'Enter EBT PIN'"></span>
            </button>
        </div>
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() -->
            <!-- /ko -->
            <!--/ko-->
        </div>
        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout" type="submit" id="fiserv-ebt-online-checkout-submit" data-bind="click: submitIframe" disabled="true">
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
        <div class="privacyPolicy">
            <span></span>Payments Powered by Fiserv.&nbsp; <a target="_blank" href="https://www.fiserv.com/privacy">Privacy Notice</a>.
        </div>
    </div>
</div>
