<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
	<div class="payment-method-title field choice">
		<input
			type="radio"
			name="payment[method]"
			class="radio"
			data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible(), afterRender: initializeAfterpay"
		>
		<label class="label" data-bind="attr: {'for': getCode()}">
			<img
				class="fiserv-afterpay-logo"
				data-bind="attr: {src: require.toUrl('Fiserv_Payments/images/Afterpay_logo.png')}"
				alt="Afterpay"
			>
			<span data-bind="text: getTitle()"></span>
		</label>
	</div>

	<div class="payment-method-content">
		<!-- ko foreach: getRegion('messages') -->
		<!-- ko template: getTemplate() -->
		<!-- /ko -->
		<!-- /ko -->

		<div class="payment-method-billing-address">
			<!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
			<!-- ko template: getTemplate() -->
			<!-- /ko -->
			<!-- /ko -->
		</div>

		<!-- Native Afterpay checkout component is mounted by the renderer. -->
		<div data-bind="visible: isPlaceOrderActionAllowed, afterRender: initializeAfterpay" id="afterpay-button-container"></div>

		<div class="checkout-agreements-block">
			<!-- ko foreach: $parent.getRegion('before-place-order') -->
			<!-- ko template: getTemplate() -->
			<!-- /ko -->
			<!-- /ko -->
		</div>

		<div class="privacyPolicy">
			<span class="privacy-icon"></span><span>
				<!-- ko i18n: 'Payments Powered by Fiserv.'-->
				<!-- /ko -->
			</span>&nbsp; <a target="_blank" href="https://www.fiserv.com/privacy">
				<!-- ko i18n: 'Privacy Notice'-->
				<!-- /ko -->
			</a>.
		</div>
	</div>
</div>
