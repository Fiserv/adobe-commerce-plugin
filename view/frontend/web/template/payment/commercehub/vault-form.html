<div class="payment-method" css="'_active': (getId() === isChecked())">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="
                    attr: {'id': getId()},
                    value: getId(),
                    click: selectPaymentMethod,
                    checked: isChecked,
                    visible: isRadioButtonVisible()"/>
        <label class="label" data-bind="attr: {'for': getId()}">
            <img data-bind="attr: {
            'src': getIcons(getCardType()).url,
            'width': getIcons(getCardType()).width,
            'height': getIcons(getCardType()).height,
            'alt': getIcons(getCardType()).title
            }" class="payment-icon">
            <span translate="'ending'"></span>
            <span text="getMaskedCard()"></span>
            (
            <span translate="'expires'"></span>:
            <span text="getExpirationDate()"></span>
            )
        </label>
    </div>

    <div class="payment-method-content">
        <each args="getRegion('messages')" render=""></each>
        <div class="payment-method-billing-address">
            <each args="data: $parent.getRegion(getBillingAddressFormName()), as: '$item'">
                <render args="$item.getTemplate()"/>
            </each>
        </div>
        <div class="checkout-agreements-block">
            <!-- Inline subscription option -->
            <div class="fiserv-subscription-container">
                <div class="field choice subscription-toggle">
                    <input type="checkbox"
                           class="checkbox"
                           data-bind="checked: isSubscriptionEnabled,
                                      attr: {'id': getId() + '_subscription_enabled'}"/>
                    <label class="label"
                           data-bind="attr: {'for': getId() + '_subscription_enabled'}">
                        <span><!-- ko i18n: 'Subscribe' --><!-- /ko --></span>
                    </label>
                </div>
                <!-- ko if: isSubscriptionEnabled -->
                <div class="field subscription-frequency">
                    <label class="label"
                           data-bind="attr: {'for': getId() + '_subscription_frequency'}">
                        <span><!-- ko i18n: 'Billing frequency' --><!-- /ko --></span>
                    </label>
                    <div class="control">
                        <select class="select"
                                data-bind="value: selectedFrequency,
                                           options: frequencyOptions,
                                           optionsValue: 'value',
                                           optionsText: 'label',
                                           attr: {'id': getId() + '_subscription_frequency'}">
                        </select>
                    </div>
                </div>
                <!-- /ko -->
            </div>

            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="
                            click: placeOrderClick,
                            attr: {title: $t('Place Order')},
                            enable: isButtonActive()
                        "
                    disabled>
                    <span translate="'Place Order'"></span>
                </button>
            </div>
        </div>
		<div class="privacyPolicy">
			<span></span>Payments Powered by Fiserv.&nbsp; <a target="_blank" href="http://www.fiserv.com/privacy">Privacy Notice</a>.
		</div>
    </div>
</div>
