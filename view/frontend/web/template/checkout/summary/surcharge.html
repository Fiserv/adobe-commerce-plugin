<!-- ko if: isFullMode() -->
<!-- ko if: hasSurcharge() -->
<tr class="totals surcharge">
    <th class="mark" scope="row">
        <span data-bind="text: title"></span>
    </th>
    <td class="amount">
        <span class="price" data-bind="text: formattedAmount()"></span>
    </td>
</tr>
<!-- ko if: disclosureText() -->
<tr class="totals surcharge-disclosure">
    <td class="mark" colspan="2">
        <span class="surcharge-disclosure-text" data-bind="text: disclosureText()"></span>
    </td>
</tr>
<!-- /ko -->
<tr class="totals grand surcharge-grand-total">
    <th class="mark" scope="row">
        <strong><span data-bind="i18n: 'Order Total'"></span></strong>
    </th>
    <td class="amount">
        <strong><span class="price" data-bind="text: adjustedGrandTotal()"></span></strong>
    </td>
</tr>
<style>
    .surcharge-grand-total ~ .grand.totals { display: none !important; }
    .surcharge-disclosure td {
        font-size: 12px;
        font-style: italic;
        color: #555;
        line-height: 1.4;
        padding-top: 4px;
        padding-bottom: 8px;
    }
</style>
<!-- /ko -->
<!-- /ko -->
